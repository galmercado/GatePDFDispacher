services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # APP_BIND=127.0.0.1 in production so only the Caddy proxy can reach the app
      - "${APP_BIND:-0.0.0.0}:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-event-door}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-972}
      WHATSAPP_MIN_INTERVAL: ${WHATSAPP_MIN_INTERVAL:-1.5}
      WHATSAPP_JITTER: ${WHATSAPP_JITTER:-0.5}
      WHATSAPP_DELETE_ON_UNADMIT: ${WHATSAPP_DELETE_ON_UNADMIT:-true}
      WHATSAPP_DELETE_AFTER_EVENT: ${WHATSAPP_DELETE_AFTER_EVENT:-true}
      WHATSAPP_DELETE_MIN_HOURS: ${WHATSAPP_DELETE_MIN_HOURS:-12}
      WHATSAPP_DELETE_MAX_HOURS: ${WHATSAPP_DELETE_MAX_HOURS:-36}
      EVENT_DURATION_HOURS: ${EVENT_DURATION_HOURS:-3}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Asia/Jerusalem}
    volumes:
      - app_data:/srv/data
      - app_storage:/srv/storage
    depends_on:
      - evolution-api

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7   # maintained image (atendai/* is stale); multi-arch incl. ARM64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # admin/QR-pairing access from the host only
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: gate
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HTTPS reverse proxy with automatic Let's Encrypt certificates. Production only:
  #   docker compose --profile prod up -d --build
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  app_storage:
  evolution_instances:
  postgres_data:
  caddy_data:
  caddy_config:
