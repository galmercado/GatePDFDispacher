{% extends "base.html" %}
{% block title %}{{ event.name }}{% endblock %}
{% block content %}
<div class="mb-3 flex items-center justify-between">
  <div class="min-w-0">
    <a href="/events" class="inline-flex items-center gap-1 text-sm text-slate-400 hover:text-white"><i class="ph ph-arrow-left"></i> Events</a>
    <h1 class="truncate text-xl font-bold text-white">{{ event.name }}</h1>
  </div>
</div>

<div id="stats" hx-get="/events/{{ event.id }}/stats" hx-trigger="refreshStats from:body, every 30s" hx-swap="innerHTML"
     class="sticky top-[57px] z-20 -mx-4 mb-3 border-b border-slate-800 bg-slate-950/90 px-4 pb-3 pt-2 backdrop-blur">
  {% include "partials/stats.html" %}
</div>

<div class="relative mb-4">
  <i class="ph ph-magnifying-glass pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-xl text-slate-500"></i>
  <input type="search" name="q" autocomplete="off" autocapitalize="none" inputmode="search" placeholder="Search name or phone…"
         hx-get="/events/{{ event.id }}/search" hx-trigger="keyup changed delay:180ms, search"
         hx-target="#attendee-list" hx-indicator="#search-spinner"
         class="w-full rounded-2xl border border-slate-700 bg-slate-900 py-3.5 pl-12 pr-12 text-base text-white placeholder-slate-500 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-500/30">
  <i id="search-spinner" class="ph ph-spinner htmx-indicator absolute right-4 top-1/2 -translate-y-1/2 animate-spin text-xl text-slate-400"></i>
</div>

<div id="attendee-list" class="space-y-3">
  {% include "partials/attendee_rows.html" %}
</div>

<dialog id="qr-modal" class="w-[calc(100%-2rem)] max-w-sm rounded-2xl border border-slate-700 bg-slate-900 p-0 text-slate-200 backdrop:bg-black/70 backdrop:backdrop-blur-sm">
  <div id="qr-content" class="p-6"></div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
  const qrModal = document.getElementById('qr-modal');
  document.body.addEventListener('htmx:afterSwap', (e) => {
    if (e.detail.target.id === 'qr-content' && !qrModal.open) qrModal.showModal();
  });
  qrModal.addEventListener('click', (e) => { if (e.target === qrModal) qrModal.close(); });
</script>
{% endblock %}
