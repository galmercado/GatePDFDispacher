{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4">
  <div class="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-brand-600/30 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 h-80 w-80 rounded-full bg-emerald-500/20 blur-3xl"></div>

  <form method="post" action="/login"
        class="pop relative w-full max-w-sm rounded-2xl border border-white/10 bg-white/5 p-7 shadow-2xl backdrop-blur-xl">
    <div class="mb-6 flex flex-col items-center gap-2 text-center">
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-500/20 text-2xl text-brand-400">
        <i class="ph-fill ph-ticket"></i></div>
      <h1 class="text-xl font-semibold text-white">Welcome to Gate</h1>
      <p class="text-sm text-slate-400">Sign in to manage the door.</p>
    </div>

    {% if error %}
    <div class="mb-4 flex items-center gap-2 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-200" role="alert">
      <i class="ph-fill ph-warning-circle"></i> {{ error }}</div>
    {% endif %}

    {% if google %}
    <a href="/auth/google/login" class="mb-4 flex w-full items-center justify-center gap-3 rounded-xl bg-white py-3 font-semibold text-slate-800 hover:bg-slate-100">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.2 5.6c4.3-4 6.8-9.9 6.8-17z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google</a>
    <div class="mb-4 flex items-center gap-3 text-xs uppercase tracking-wide text-slate-500"><span class="h-px flex-1 bg-white/10"></span>or<span class="h-px flex-1 bg-white/10"></span></div>
    {% endif %}
    <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-400" for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username" value="{{ email }}"
           class="mb-4 w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 text-base text-white placeholder-slate-500 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-500/30"
           placeholder="you@example.org">
    <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-400" for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password"
           class="mb-6 w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 text-base text-white outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-500/30">
    <button class="flex w-full items-center justify-center gap-2 rounded-xl bg-brand-500 py-3 font-semibold text-white hover:bg-brand-600">
      <i class="ph-bold ph-sign-in"></i> Sign in</button>
  </form>
</div>
{% endblock %}
