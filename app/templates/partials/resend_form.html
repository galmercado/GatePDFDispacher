<div class="mb-3 flex items-start justify-between gap-3">
  <div class="min-w-0">
    <h2 class="text-lg font-semibold text-white">Resend tickets</h2>
    <p class="truncate text-sm text-slate-400">{{ attendee.name }}</p>
  </div>
  <button type="button" onclick="document.getElementById('qr-modal').close()" class="text-slate-400 hover:text-white" aria-label="Close"><i class="ph ph-x text-xl"></i></button>
</div>
{% if errors %}<div class="mb-3 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-200" role="alert">
  <ul class="list-inside list-disc">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
<p class="mb-3 text-sm text-slate-300">Send the {{ count }} ticket{{ 's' if count != 1 }} already handed out to this guest once more (for example if the message never arrived).
  Who is admitted does not change.</p>
<form hx-post="/attendees/{{ attendee.id }}/resend" data-progress="Sending the tickets again" hx-target="#qr-content" hx-swap="innerHTML">
  <div class="grid grid-cols-2 gap-2">
    <button name="via" value="whatsapp" class="flex h-14 items-center justify-center gap-2 rounded-xl bg-green-500 font-bold text-green-950 hover:bg-green-400">
      <i class="ph-fill ph-whatsapp-logo text-2xl"></i> WhatsApp</button>
    <button name="via" value="qr" class="flex h-14 items-center justify-center gap-2 rounded-xl bg-brand-500 font-bold text-white hover:bg-brand-400">
      <i class="ph-bold ph-qr-code text-2xl"></i> QR</button>
  </div>
</form>
