<div class="mb-3 flex items-start justify-between gap-3">
  <div class="min-w-0">
    <h2 class="truncate text-lg font-semibold text-white">{{ attendee.name }}</h2>
    <p class="text-sm text-slate-400">Scan to open the ticket PDF</p>
  </div>
  <button onclick="document.getElementById('qr-modal').close()" class="text-slate-400 hover:text-white" aria-label="Close"><i class="ph ph-x text-xl"></i></button>
</div>
{% for c in codes %}
<div class="mb-3 rounded-2xl bg-white p-3 text-center">
  <img src="{{ c.svg }}" alt="QR code for ticket {{ c.page }}" class="mx-auto w-full max-w-[260px]">
  <p class="mt-1 text-xs font-medium text-slate-600">Ticket {{ loop.index }} of {{ codes|length }}</p>
</div>
{% else %}
<div class="rounded-xl border border-dashed border-slate-700 p-6 text-center text-slate-400">
  <i class="ph ph-file-x text-3xl"></i><p class="mt-1">No ticket PDF attached yet.</p></div>
{% endfor %}
