<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Gate{% endblock %} · Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: { brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' } }
      } }
    }
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    .htmx-indicator { opacity: 0; transition: opacity 150ms; }
    button:active:not(:disabled) { transform: scale(.97); }
    button, a { transition: background-color .15s, transform .1s, border-color .15s, color .15s; }
    @keyframes pop { from { transform: scale(.96); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    .pop { animation: pop .18s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-200 antialiased">
  {% block body %}
  <header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/85 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
      <a href="/events" class="flex items-center gap-2 font-semibold text-white">
        <i class="ph-fill ph-ticket text-xl text-brand-400"></i> Gate
      </a>
      {% if user %}
      <div class="flex items-center gap-3 text-sm">
        <span class="hidden text-slate-400 sm:inline">{{ user.full_name }}
          <span class="ml-1 rounded-full bg-slate-800 px-2 py-0.5 text-xs uppercase tracking-wide text-slate-300">{{ user.role.value }}</span></span>
        {% if user.role.value == 'admin' %}<a href="/lines" class="text-slate-300 hover:text-white" aria-label="WhatsApp lines" title="WhatsApp lines"><i class="ph ph-sim-card text-lg"></i></a>
        <a href="/inbox" class="text-slate-300 hover:text-white" aria-label="Ticket inbox" title="Ticket inbox (tickets received on WhatsApp)"><i class="ph ph-tray-arrow-down text-lg"></i></a>
        <a href="/settings" class="text-slate-300 hover:text-white" aria-label="Site settings" title="Site settings"><i class="ph ph-sliders-horizontal text-lg"></i></a>
        <a href="/members" class="text-slate-300 hover:text-white" aria-label="Members phone book" title="Members phone book"><i class="ph ph-address-book text-lg"></i></a>
        <a href="/users" class="text-slate-300 hover:text-white" aria-label="Users"><i class="ph ph-users text-lg"></i></a>{% endif %}
        <a href="/account" class="text-slate-300 hover:text-white" aria-label="Account"><i class="ph ph-user-gear text-lg"></i></a>
        <form method="post" action="/logout">
          <button class="flex items-center gap-1 rounded-lg border border-slate-700 px-3 py-1.5 text-slate-300 hover:bg-slate-800" aria-label="Sign out">
            <i class="ph ph-sign-out"></i><span>Sign out</span>
          </button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-4 pb-24 pt-5">{% block content %}{% endblock %}</main>
  {% endblock %}

  <dialog id="progress-modal" class="w-[calc(100%-2rem)] max-w-xs rounded-2xl border border-slate-700 bg-slate-900 p-0 text-slate-200 backdrop:bg-black/70 backdrop:backdrop-blur-sm" aria-live="polite">
    <div class="p-6 text-center">
      <div class="relative mx-auto h-36 w-36">
        <svg viewBox="0 0 120 120" class="h-36 w-36 -rotate-90" aria-hidden="true">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#1e293b" stroke-width="10"/>
          <circle id="pg-ring" cx="60" cy="60" r="52" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"
                  stroke-dasharray="326.73" stroke-dashoffset="326.73" style="transition: stroke-dashoffset .35s ease"/>
        </svg>
        <span id="pg-pct" class="absolute inset-0 flex items-center justify-center text-4xl font-bold text-white" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</span>
      </div>
      <h2 id="pg-title" class="mt-4 text-lg font-semibold text-white">Working…</h2>
      <p id="pg-label" class="mt-1 min-h-[2.5rem] text-sm text-slate-400"></p>
      <button type="button" id="pg-cancel" class="mt-3 hidden text-xs text-slate-400 underline hover:text-white">Cancel</button>
    </div>
  </dialog>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>

  <script>
    function showToast(message, kind) {
      const el = document.createElement('div');
      const ok = kind !== 'error';
      el.className = 'pop pointer-events-auto flex max-w-sm items-center gap-2 rounded-xl border px-4 py-3 text-sm shadow-xl ' +
        (ok ? 'border-emerald-500/30 bg-emerald-950 text-emerald-200' : 'border-rose-500/30 bg-rose-950 text-rose-200');
      const icon = document.createElement('i');
      icon.className = 'ph-fill ' + (ok ? 'ph-check-circle' : 'ph-warning-circle') + ' text-lg';
      const text = document.createElement('span');
      text.textContent = message;
      el.append(icon, text);
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3800);
    }
    document.body.addEventListener('toast', (e) => showToast(e.detail.message, e.detail.kind));
    document.body.addEventListener('htmx:responseError', (e) => {
      if (e.detail.xhr.status === 401) return;
      showToast(e.detail.xhr.responseText || 'Request failed', 'error');
    });
    document.body.addEventListener('htmx:sendError', () => showToast('Network error - check your connection', 'error'));
  </script>

  <script>
    // Percentage popup for long actions. A form or htmx element with data-progress="Title" shows it; the server reports its
    // progress under a random job token (GET /jobs/<token>). It only appears if the action takes longer than 5 seconds.
    window.Progress = (function () {
      const dlg = document.getElementById('progress-modal'), ring = document.getElementById('pg-ring'),
            pct = document.getElementById('pg-pct'), label = document.getElementById('pg-label'),
            title = document.getElementById('pg-title'), cancel = document.getElementById('pg-cancel');
      const C = 326.73;
      let shown = 0, base = 0, showTimer = null, pollTimer = null, token = '', onCancel = null;
      dlg.addEventListener('cancel', (e) => e.preventDefault());
      cancel.addEventListener('click', () => { if (onCancel) onCancel(); });
      function paint(p) {
        shown = Math.max(shown, Math.min(100, Math.round(p)));
        ring.style.strokeDashoffset = C * (1 - shown / 100);
        pct.textContent = shown + '%'; pct.setAttribute('aria-valuenow', shown);
      }
      async function poll() {
        try {
          const r = await fetch('/jobs/' + token, { credentials: 'same-origin', cache: 'no-store' });
          if (!r.ok) return;
          const j = await r.json();
          paint(base + (100 - base) * j.pct / 100);
          if (j.label) label.textContent = j.label;
        } catch (err) { /* try again */ }
      }
      return {
        newToken: () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36),
        begin(opts) {
          this.end(true);
          shown = 0; base = opts.base || 0; token = opts.token; onCancel = opts.onCancel || null;
          paint(0); title.textContent = opts.title || 'Working…'; label.textContent = opts.label || '';
          cancel.classList.toggle('hidden', !onCancel);
          showTimer = setTimeout(() => { if (!dlg.open) dlg.showModal(); }, opts.delay === undefined ? 5000 : opts.delay);
          if (token) pollTimer = setInterval(poll, 450);
        },
        upload(p, text) { paint(p * base / 100); if (text) label.textContent = text; },
        text(t) { label.textContent = t; },
        end(quick) {
          clearTimeout(showTimer); clearInterval(pollTimer); showTimer = pollTimer = null; onCancel = null;
          if (quick) { if (dlg.open) dlg.close(); return; }
          paint(100);
          setTimeout(() => { if (dlg.open) dlg.close(); }, 300);
        },
      };
    })();

    // forms (full page results): submitted in the background so the ring can follow the upload and the processing
    document.addEventListener('submit', (e) => {
      const form = e.target.closest ? e.target.closest('form[data-progress]') : null;
      if (!form || e.defaultPrevented || form.hasAttribute('hx-post') || !window.XMLHttpRequest || !window.FormData) return;
      const fileInput = form.querySelector('input[type=file]');
      if (fileInput && !fileInput.files.length) return;                      // nothing to upload: normal submit / browser validation
      const file = fileInput ? fileInput.files[0] : null, token = Progress.newToken();
      const mb = (n) => (n / 1048576).toFixed(n > 10485760 ? 0 : 1) + ' MB';
      if (file && form.dataset.maxMb && file.size > Number(form.dataset.maxMb) * 1048576) {
        e.preventDefault(); showToast('File is too large (' + mb(file.size) + '); the limit is ' + form.dataset.maxMb + ' MB.', 'error'); return;
      }
      e.preventDefault();
      const xhr = new XMLHttpRequest();
      Progress.begin({ title: form.dataset.progress, token, base: file ? 30 : 0, onCancel: () => xhr.abort(),
                       label: file ? 'Uploading ' + file.name + ' (' + mb(file.size) + ')…' : 'Starting…' });
      if (file) {
        xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) Progress.upload(ev.loaded * 100 / ev.total, 'Uploading… ' + mb(ev.loaded) + ' of ' + mb(ev.total)); };
        xhr.upload.onload = () => { Progress.upload(100, 'Upload complete - processing…'); };
      }
      xhr.onload = () => { Progress.end(); setTimeout(() => { document.open(); document.write(xhr.responseText); document.close(); }, 320); };
      xhr.onerror = () => { Progress.end(true); showToast('The action failed - check your connection and try again.', 'error'); };
      xhr.onabort = () => { Progress.end(true); showToast('Cancelled.', 'error'); };
      const body = new FormData(form); body.append('job', token);
      xhr.open('POST', form.action); xhr.send(body);
    });

    // htmx buttons / forms (door cards, popups): same popup, the page behind is updated by htmx afterwards
    function progressEl(elt) { return elt && elt.closest ? elt.closest('[data-progress]') : null; }
    function jobFor(elt) { const el = progressEl(elt); if (!el) return null; if (!el._job) el._job = Progress.newToken(); return el; }
    document.body.addEventListener('htmx:configRequest', (e) => { const el = jobFor(e.detail.elt); if (el) e.detail.parameters['job'] = el._job; });
    document.body.addEventListener('htmx:beforeRequest', (e) => {
      const el = jobFor(e.detail.elt); if (el) Progress.begin({ title: el.dataset.progress, token: el._job });
    });
    document.body.addEventListener('htmx:afterRequest', (e) => {
      const el = progressEl(e.detail.elt); if (el && el._job) { Progress.end(); el._job = null; }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
